name: getx_view
description: A new brick created with the Mason CLI.

version: 0.1.0+1

environment:
  mason: ^0.1.2

vars:
  name:
    type: string
    description: "The name of the view"
    default: "home"
    prompt: "What is the name of your feature/view? (e.g., login, taxi_detail)"

  path:
    type: string
    description: "The folder path where files will be generated"
    default: "lib/features"
    prompt: "Where do you want to generate? (Enter folder path)"
